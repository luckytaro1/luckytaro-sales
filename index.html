<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucky Taro, Inc.</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--taro:#7c3aed;--taro2:#a78bfa;--mango:#f59e0b;--leaf:#22c55e;--ink:#0f0b1e;--fg:#f4f2ff;--mut:#b4acd4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--fg);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.lp{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{position:relative;overflow:hidden;padding:56px max(32px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:center;gap:22px;
  background:radial-gradient(900px 500px at 10% 0%,#5b21b6 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#b45309 0%,transparent 55%),linear-gradient(160deg,#2e1065,#1e1036 55%,#3b1d0b)}
.hero .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.2px}
.hero .brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--taro2),var(--taro));display:grid;place-items:center;font-size:26px;box-shadow:0 8px 24px rgba(124,58,237,.45)}
.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.08;margin:0;font-weight:800;max-width:14ch;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--mango),#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--mut);font-size:17px;margin:0;max-width:40ch}
.feats{display:grid;gap:12px;margin-top:6px;max-width:440px}
.feat{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;backdrop-filter:blur(4px)}
.feat i{font-style:normal;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.feat b{display:block;font-size:15px}.feat small{color:var(--mut);font-size:13px}
.f1 i{background:rgba(34,197,94,.18)}.f2 i{background:rgba(245,158,11,.2)}.f3 i{background:rgba(167,139,250,.22)}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.9;pointer-events:none;z-index:0}.hero>*:not(.blob){position:relative;z-index:1}
.side{display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right)) 40px max(20px,env(safe-area-inset-left));background:#140f26}
.login{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0;font-size:26px;font-weight:800}.login .sub{margin:-8px 0 6px;color:var(--mut)}
.login label{color:var(--mut);display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.field{background:#1d1736;border:1.5px solid #3b3263;border-radius:12px;padding:13px 14px;outline:none;color:var(--fg);font:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--taro2);box-shadow:0 0 0 4px rgba(167,139,250,.18)}
.pwrap{position:relative}.pwrap .field{width:100%;padding-right:64px}.pwrap button{all:unset;cursor:pointer;position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--taro2);font-size:13px;font-weight:700}
.btn{cursor:pointer;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:16px;color:#1a1033;background:linear-gradient(90deg,var(--mango),#fbbf24);box-shadow:0 10px 24px rgba(245,158,11,.25);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.7;cursor:default}
.chk{flex-direction:row!important;align-items:center;gap:10px!important;font-weight:500!important}.chk input{width:18px;height:18px;accent-color:var(--taro)}
.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#fecaca;border-radius:10px;padding:10px 12px;font-size:14px}
.help{color:var(--mut);font-size:13px;text-align:center;margin-top:4px}.lock{color:var(--mut);font-size:12.5px;display:flex;gap:6px;justify-content:center;align-items:center}
.red{color:#f87171}.mut{color:var(--mut)}.row{display:flex;gap:8px;align-items:center}
@media (max-width:860px){.lp{grid-template-columns:1fr}.hero{padding:34px 20px 30px;gap:14px}.hero h1{font-size:30px}.hero p.lead{font-size:15px}.feats{display:none}.blob{opacity:.35;transform:scale(.7)}.side{padding:26px 20px 40px;align-items:flex-start}}
</style></head><body><div id="app"><p class="mut" style="text-align:center;margin-top:40vh">Opening…</p></div>
<script>
(() => { "use strict";
const ORDER_EMAIL = "purchase@luckytaro.com";
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (/[?&]out\b/.test(location.search)){ store.del("lt-pw"); history.replaceState(null, "", location.pathname); }
// the salesperson's file is locked with their password (AES-256-GCM, key from PBKDF2-SHA256)
async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(code, pw){ code = code.trim().toUpperCase(); const f = (await sha("lt-sales|" + code)).slice(0, 20);
  const r = await fetch(`data/${f}.json?t=${Date.now()}`, { cache: "no-store" }); if (!r.ok) throw new Error("code"); const E = await r.json();
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(E.salt), iterations: E.it, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let raw; try { raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct)); } catch(e){ throw new Error("pw"); }
  return JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text()); }
function loginView(err, code0){ document.getElementById("app").innerHTML = `<div class="lp">
  <section class="hero"><span class="blob" style="width:220px;height:220px;right:-60px;top:-60px;background:radial-gradient(circle at 35% 35%,#c4b5fd,#7c3aed 60%,transparent 70%)"></span><span class="blob" style="width:160px;height:160px;right:12%;bottom:-50px;background:radial-gradient(circle at 35% 35%,#fde68a,#f59e0b 60%,transparent 70%)"></span>
    <div class="brand"><span class="logo">🥭</span>Lucky Taro, Inc.</div>
    <h1>Fresh prices.<br><em>Faster sales.</em></h1>
    <p class="lead">Today's price list, stock and every one of your customers ─ in your pocket, wherever you are.</p>
    <div class="feats"><div class="feat f1"><i>📦</i><span><b>Live stock & prices</b><small>What's in, what's coming, what to push</small></span></div>
      <div class="feat f2"><i>💲</i><span><b>Quotes in seconds</b><small>Their prices, sent by WhatsApp or email</small></span></div>
      <div class="feat f3"><i>🧾</i><span><b>Orders straight to the office</b><small>Pick the items, set the cases, send</small></span></div></div></section>
  <section class="side"><form class="login" id="lf" autocomplete="on"><h2>Welcome back 👋</h2><p class="sub">Sign in to your sales desk</p>
    <label>Username<input class="field" id="lc" autocomplete="username" autocapitalize="characters" spellcheck="false" value="${esc(code0 || store.get("lt-code") || "")}"></label>
    <label>Password<span class="pwrap"><input class="field" id="lp" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" id="lpShow">Show</button></span></label>
    <label class="chk"><input type="checkbox" id="lr" ${store.get("lt-pw") ? "checked" : ""}> Keep me signed in on this device</label>
    ${err ? `<div class="err">${esc(err)}</div>` : ""}<button class="btn" type="submit">Sign in →</button>
    <div class="lock">🔒 Your data is locked with your own password</div><div class="help">Forgot your password? Ask the office for a new one.</div></form></section></div>`;
  const pi = document.getElementById("lp"), sb = document.getElementById("lpShow"); sb.onclick = () => { pi.type = pi.type === "password" ? "text" : "password"; sb.textContent = pi.type === "password" ? "Show" : "Hide"; pi.focus(); };
  (document.getElementById("lc").value ? pi : document.getElementById("lc")).focus();
  document.getElementById("lf").onsubmit = async e => { e.preventDefault(); const c = document.getElementById("lc").value, p = document.getElementById("lp").value; if (!c || !p) return; const sbtn = e.target.querySelector(".btn"); sbtn.textContent = "Opening your desk…"; sbtn.disabled = true;
    try { const P = await unlock(c, p); store.set("lt-code", c.trim().toUpperCase()); if (document.getElementById("lr").checked) store.set("lt-pw", p); else store.del("lt-pw"); boot(P); }
    catch(x){ loginView(x.message === "code" ? "Username or password is wrong." : x.message === "pw" ? "Username or password is wrong." : "Couldn't open ─ check your connection.", c); } }; }
// ---------- the desk's own salesperson screens, fed from the unlocked file instead of claude.ai ----------
function boot(P){ const code = P.meta.code, TK = "lt-team-" + code, SK = "lt-sent-" + code;
  const docs = { ...P.docs, "settings/team": { members: { U: { code: P.meta.rep, name: P.meta.name, role: "rep" } } } };
  try { docs["team/U"] = JSON.parse(store.get(TK) || "{}"); } catch(e){ docs["team/U"] = {}; }
  const L = new Map(), clone = d => d == null ? d : JSON.parse(JSON.stringify(d));
  const snap = path => { const d = docs[path]; return { exists: d !== undefined, id: path.split("/").pop(), ref: { path, id: path.split("/").pop() }, data: () => clone(d), get: k => d ? d[k] : undefined }; };
  const kids = path => { const pre = path + "/"; const ds = Object.keys(docs).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(snap); return { docs: ds, empty: !ds.length, size: ds.length, forEach: f => ds.forEach(f), docChanges: () => ds.map(d => ({ type: "added", doc: d })) }; };
  const notify = path => { (L.get(path) || []).forEach(cb => { try { cb(snap(path)); } catch(e){} }); const par = path.split("/").slice(0, -1).join("/"); (L.get("c:" + par) || []).forEach(cb => { try { cb(kids(par)); } catch(e){} }); };
  const wrote = path => { if (path === "team/U"){ store.set(TK, JSON.stringify(docs[path] || {})); setTimeout(ordersBar, 50); } notify(path); };
  const doc = path => ({ id: path.split("/").pop(), path,
    get: async () => snap(path), onSnapshot: (cb, err) => { (L.get(path) || L.set(path, []).get(path)).push(cb); setTimeout(() => cb(snap(path)), 0); return () => {}; },
    set: async (v, o) => { docs[path] = o && o.merge ? { ...(docs[path] || {}), ...clone(v) } : clone(v); wrote(path); },
    update: async v => { if (docs[path] === undefined) throw Object.assign(new Error("not found"), { code: "not_found" }); docs[path] = { ...docs[path], ...clone(v) }; wrote(path); },
    delete: async () => { delete docs[path]; wrote(path); }, collection: n => coll(path + "/" + n) });
  const coll = path => { const q = { id: path.split("/").pop(), path, where: () => q, orderBy: () => q, limit: () => q, startAfter: () => q, get: async () => kids(path),
    onSnapshot: cb => { (L.get("c:" + path) || L.set("c:" + path, []).get("c:" + path)).push(cb); setTimeout(() => cb(kids(path)), 0); return () => {}; }, doc: id => doc(path + "/" + (id || Math.random().toString(36).slice(2))), add: async v => { const d = doc(path + "/" + Math.random().toString(36).slice(2)); await d.set(v); return d; } }; return q; };
  const db = { doc, collection: coll, batch: () => { const ops = []; return { set: (d, v, o) => ops.push(() => d.set(v, o)), update: (d, v) => ops.push(() => d.update(v)), delete: d => ops.push(() => d.delete()), commit: async () => { for (const f of ops) await f(); } }; }, runTransaction: async f => f({ get: d => d.get(), set: (d, v) => d.set(v), update: (d, v) => d.update(v) }) };
  const user = { isOwner: async () => false, canEdit: async () => false, can: async n => n === "data.write", id: async () => "U", me: async () => ({ id: "U", name: P.meta.name || code }), profiles: async () => ({}), search: async () => [] };
  window.claude = { use: async n => n === "db" ? db : n === "user" ? user : null };
  // sales orders go to the office by email (there's no live link back to the desk from here)
  const custName = id => { for (const k in docs){ if (!/\/cust\d+$/.test(k)) continue; const c = (docs[k].list || []).find(x => x.id === id); if (c) return [c.name, c.code]; } return [id, ""]; };
  const pending = () => { let sent = {}; try { sent = JSON.parse(store.get(SK) || "{}"); } catch(e){} return ((docs["team/U"] || {}).soOut || []).filter(so => so && !so.void && (so.lines || []).some(l => Number(l.q) > 0) && sent[so.uid] !== so.at); };
  function ordersBar(){ let b = document.getElementById("ltOrd"); const P0 = pending(); if (!P0.length){ if (b) b.remove(); return; }
    if (!b){ b = document.createElement("div"); b.id = "ltOrd"; b.style.cssText = "position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9999;background:#b91c1c;color:#fff;border-radius:12px;padding:10px 14px;font:600 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center"; document.body.appendChild(b); }
    b.innerHTML = `${P0.length} order${P0.length === 1 ? "" : "s"} not sent to the office <button id="ltSend" style="all:unset;cursor:pointer;background:#fff;color:#b91c1c;border-radius:8px;padding:6px 10px">✉ Send</button>`;
    document.getElementById("ltSend").onclick = () => { const O = pending(); const txt = O.map(so => { const [n, c] = custName(so.cid); return [`SALES ORDER ─ ${n}${c ? " (" + c + ")" : ""}`, `Salesperson: ${P.meta.name || ""} (${P.meta.rep})`, `Ship: ${so.date || ""}`, so.ref ? `PO / note: ${so.ref}` : null, "", ...so.lines.filter(l => Number(l.q) > 0).map(l => `${l.q} cs  ${l.d}${l.p ? " " + l.p : ""}${l.no ? "  #" + l.no : ""}`), "", `[order-id ${so.uid}]`].filter(x => x !== null).join("\n"); }).join("\n\n────────\n\n");
      const subj = O.length === 1 ? `Sales order ─ ${custName(O[0].cid)[0]} ─ ${P.meta.rep}` : `${O.length} sales orders ─ ${P.meta.rep}`;
      location.href = `mailto:${ORDER_EMAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(txt)}`;
      setTimeout(() => { if (window.confirm("Did the email go out? Press OK and these orders are marked as sent.")){ let sent = {}; try { sent = JSON.parse(store.get(SK) || "{}"); } catch(e){} O.forEach(so => sent[so.uid] = so.at); store.set(SK, JSON.stringify(sent)); ordersBar(); } }, 1500); }; }
  (async () => { const A = await (await fetch("app.json?t=" + Date.now(), { cache: "no-store" })).json(); const k = await crypto.subtle.importKey("raw", b64(P.appkey), "AES-GCM", false, ["decrypt"]);
    const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(A.iv) }, k, b64(A.ct)); return new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); })().then(html => { document.open(); document.write(html); document.close(); const st = document.createElement("style"); st.textContent = '#askFab,[data-tmgo="ask"]{display:none!important}'; (document.head || document.body).appendChild(st); document.title = "Lucky Taro, Inc."; setTimeout(ordersBar, 3000); }, () => { store.del("lt-pw"); loginView("Couldn't open the screens ─ sign in again."); }); }
if (!window.isSecureContext || !(window.crypto && crypto.subtle)){ document.getElementById("app").innerHTML = `<div class="side" style="min-height:100vh"><div class="login"><h2>🔒 Secure link needed</h2><p>This page must be opened with <b>https://</b> so your password stays private.</p><p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://${esc(location.host + location.pathname)}">Open the secure page</a></p><p class="mut">If that doesn't open yet, the office is still switching it on ─ try again later.</p></div></div>`; return; }
(async () => { const c = store.get("lt-code"), p = store.get("lt-pw"); if (c && p){ try { return boot(await unlock(c, p)); } catch(e){} } loginView(); })();
})();
</script></body></html>
