<script>
(() => { "use strict";
const ORDER_EMAIL = "purchase@luckytaro.com", LIVE = "https://lt-live.purchase-3d8.workers.dev";
// the newest locked file: straight from the office desk (Cloudflare link) when it's there and newer, else the copy on this site
async function liveGet(f){ try { const r = await fetch(`${LIVE}/d/${f}?t=${Date.now()}`, { cache: "no-store" }); if (!r.ok) return null; let E = await r.json();
    if (E && E.parts){ const n = Math.min(Number(E.parts) || 0, 40), pid = String(E.pid || f).replace(/[^A-Za-z0-9_-]/g, ""); if (!n) return null;
      const P = await Promise.all(Array.from({ length: n }, (_, i) => fetch(`${LIVE}/d/${pid}_p${i}?t=${Date.now()}`, { cache: "no-store" }).then(x => x.ok ? x.text() : Promise.reject()))); E = JSON.parse(P.join("")); }
    return E && E.ct ? E : null; } catch(e){ return null; } }
const ghGet = f => fetch(`data/${f}.json?t=${Date.now()}`, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
async function getLocked(f){ const [a, b] = await Promise.all([ghGet(f), liveGet(f)]); if (a && b) return (b.at || 0) >= (a.at || 0) ? b : a; return b || a; }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (/[?&]out\b/.test(location.search)){ store.del("lt-pw"); history.replaceState(null, "", location.pathname); }
// the salesperson's file is locked with their password (AES-256-GCM, key from PBKDF2-SHA256)
async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// device lock: this browser's own id (kept on the device) ─ the office approves up to 2 devices per login; the live link hands the device key only to those
const devId = () => { let d = store.get("lt-dev"); if (!d || !/^[A-Za-z0-9]{16,40}$/.test(d)){ d = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join(""); store.set("lt-dev", d); } return d; };
const devName = () => { const u = navigator.userAgent; const os = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : /Mac/.test(u) ? "Mac" : "Device"; const br = /Edg\//.test(u) ? "Edge" : /CriOS|Chrome\//.test(u) ? "Chrome" : /Firefox|FxiOS/.test(u) ? "Firefox" : /Safari/.test(u) ? "Safari" : "browser"; return os + " · " + br; };
const DKC = {};
async function devKey(f, quiet){ if (DKC[f] !== undefined) return DKC[f]; let r; try { r = await fetch(`${LIVE}/k/${f}`, { method: "POST", headers: { "content-type": "text/plain" }, body: JSON.stringify({ dev: devId(), nm: devName() }) }); } catch(e){ if (quiet) return ""; throw new Error("net"); }
  if (r.status === 403){ let j = {}; try { j = await r.json(); } catch(e){} const x = new Error("device"); x.nm = j.nm || devName(); x.where = j.where || ""; throw x; }
  if (!r.ok){ if (quiet) return ""; throw new Error("net"); } let j = {}; try { j = await r.json(); } catch(e){} return (DKC[f] = String(j.dk || "")); }
async function unlock(code, pw, E0){ code = code.trim().toUpperCase(); const f = (await sha("lt-sales|" + code)).slice(0, 20);
  let E = E0; if (!E){ E = await getLocked(f); if (!E) throw new Error("code"); }
  const dk = E.dk ? await devKey(f) : (E0 ? "" : await devKey(f, true).then(() => "", () => ""));   /* a locked file needs this device's key; otherwise the sign-in is just logged */
  if (E.dk && !dk) throw new Error("device");
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(E.dk ? pw + "|" + dk : pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(E.salt), iterations: E.it, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let raw; try { raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct)); } catch(e){ throw new Error("pw"); }
  return JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text()); }
function loginView(err, code0){ document.getElementById("app").innerHTML = `<div class="lp">

      <label>Username<input class="field" id="lc" autocomplete="username" autocapitalize="characters" spellcheck="false" value="${esc(code0 || "")}"></label>
      <label>Password<span class="pwrap"><input class="field" id="lp" type="password" autocomplete="current-password"><button type="button" id="lpShow">Show</button></span></label>
      ${err ? `<div class="err">${esc(err)}</div>` : ""}<button class="btn" type="submit">Sign in</button>
      <div class="lock">🔒 Locked with your own password · forgot it? Ask the office.</div></form>
    <div class="foot">© Lucky Taro, Inc. · Los Angeles</div></div></section></div>`;
  const pi = document.getElementById("lp"), sb = document.getElementById("lpShow"); sb.onclick = () => { pi.type = pi.type === "password" ? "text" : "password"; sb.textContent = pi.type === "password" ? "Show" : "Hide"; pi.focus(); };
  (document.getElementById("lc").value ? pi : document.getElementById("lc")).focus();
  document.getElementById("lf").onsubmit = async e => { e.preventDefault(); const c = document.getElementById("lc").value, p = document.getElementById("lp").value; if (!c || !p) return; const sbtn = e.target.querySelector(".btn"); sbtn.textContent = "Opening your desk…"; sbtn.disabled = true;
    try { const P = await unlock(c, p); boot(P, c, p); }
    catch(x){ loginView(x.message === "code" ? "Username or password is wrong." : x.message === "pw" ? "Username or password is wrong." : x.message === "device" ? `This ${x.nm || "device"} isn't approved yet. Ask the office to approve it, then sign in again.` : "Couldn't open ─ check your connection.", c); } }; }
// ---------- the desk's own salesperson screens, fed from the unlocked file instead of claude.ai ----------
function boot(P, lc, lp){ const code = P.meta.code, TK = "lt-team-" + code, SK = "lt-sent-" + code;
  const docs = { ...P.docs, "settings/team": { members: { U: { code: P.meta.rep, name: P.meta.name, role: P.meta.role || "rep" } } } };
  try { docs["team/U"] = JSON.parse(store.get(TK) || "{}"); } catch(e){ docs["team/U"] = {}; }
  const soInOf = () => (docs["team/U/pkg/meta"] || {}).soIn || []; if (soInOf().length) docs["team/U"].soIn = soInOf();   /* orders read from the pictures they emailed */
  const L = new Map(), clone = d => d == null ? d : JSON.parse(JSON.stringify(d));
  const snap = path => { const d = docs[path]; return { exists: d !== undefined, id: path.split("/").pop(), ref: { path, id: path.split("/").pop() }, data: () => clone(d), get: k => d ? d[k] : undefined }; };
  const kids = path => { const pre = path + "/"; const ds = Object.keys(docs).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(snap); return { docs: ds, empty: !ds.length, size: ds.length, forEach: f => ds.forEach(f), docChanges: () => ds.map(d => ({ type: "added", doc: d })) }; };
  const notify = path => { (L.get(path) || []).forEach(cb => { try { cb(snap(path)); } catch(e){} }); const par = path.split("/").slice(0, -1).join("/"); (L.get("c:" + par) || []).forEach(cb => { try { cb(kids(par)); } catch(e){} }); };
  const act = what => { fid.then(f => fetch(`${LIVE}/log/${f}`, { method: "POST", headers: { "content-type": "text/plain" }, body: JSON.stringify({ what: String(what).slice(0, 300) }), keepalive: true })).catch(() => {}); };   /* what they did shows in the office Log */
  window.__ltAct = act;
  /* order pictures go straight to the office through the live link (no email): one POST per page, the desk picks them up */
  window.__ltPic = async (pages, note) => { const f = await fid, g = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    for (let i = 0; i < pages.length; i++){ const r = await fetch(`${LIVE}/pic/${f}`, { method: "POST", headers: { "content-type": "text/plain" }, body: JSON.stringify({ g, p: i + 1, n: pages.length, b: pages[i], note: String(note || "").slice(0, 200) }) });
      const t = r.ok ? await r.text() : ""; if (r.status === 429) throw new Error("busy"); if (t !== "ok") throw new Error("failed " + r.status); } return g; };
  const wrote = path => { if (/^log\//.test(path)){ const d = docs[path]; if (d && d.what) act(d.what); }
    if (path === "team/U"){ store.set(TK, JSON.stringify(docs[path] || {})); setTimeout(ordersBar, 50); } notify(path); };
  const doc = path => ({ id: path.split("/").pop(), path,
    get: async () => snap(path), onSnapshot: (cb, err) => { (L.get(path) || L.set(path, []).get(path)).push(cb); setTimeout(() => cb(snap(path)), 0); return () => {}; },
    set: async (v, o) => { docs[path] = o && o.merge ? { ...(docs[path] || {}), ...clone(v) } : clone(v); wrote(path); },
    update: async v => { if (docs[path] === undefined) throw Object.assign(new Error("not found"), { code: "not_found" }); docs[path] = { ...docs[path], ...clone(v) }; wrote(path); },
    delete: async () => { delete docs[path]; wrote(path); }, collection: n => coll(path + "/" + n) });
  const coll = path => { const q = { id: path.split("/").pop(), path, where: () => q, orderBy: () => q, limit: () => q, startAfter: () => q, get: async () => kids(path),
    onSnapshot: cb => { (L.get("c:" + path) || L.set("c:" + path, []).get("c:" + path)).push(cb); setTimeout(() => cb(kids(path)), 0); return () => {}; }, doc: id => doc(path + "/" + (id || Math.random().toString(36).slice(2))), add: async v => { const d = doc(path + "/" + Math.random().toString(36).slice(2)); await d.set(v); return d; } }; return q; };
  const db = { doc, collection: coll, batch: () => { const ops = []; return { set: (d, v, o) => ops.push(() => d.set(v, o)), update: (d, v) => ops.push(() => d.update(v)), delete: d => ops.push(() => d.delete()), commit: async () => { for (const f of ops) await f(); } }; }, runTransaction: async f => f({ get: d => d.get(), set: (d, v) => d.set(v), update: (d, v) => d.update(v) }) };
  const user = { isOwner: async () => false, canEdit: async () => false, can: async n => n === "data.write", id: async () => "U", me: async () => ({ id: "U", name: P.meta.name || code }), profiles: async () => ({}), search: async () => [] };
  const downloads = { save: async ({ filename, data }) => { try { act(`Downloaded ${filename}`); } catch(e){} const u = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: /\.csv$/i.test(filename) ? "text/csv" : "application/octet-stream" })); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 2000); return true; } };
  window.__ltWeb = true; window.__ltCode = code;
  // stays up to date while open: every minute, the newest prices / stock / orders from the office (only downloads when something changed)
  let lastAt = P.meta.at; const fid = sha("lt-sales|" + String(lc || code).trim().toUpperCase()).then(h => h.slice(0, 20));
  // every 30 s a tiny "when was it saved" check on the live link; the whole file only downloads when it changed (the site copy: every 5 minutes, or when the live link is down)
  let lastW = 0, ghAt = 0;
  const fresh = async () => { if (document.hidden || !lp) return; try { const f = await fid; let E = null;
      const h = await fetch(`${LIVE}/h/${f}?t=${Date.now()}`, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
      if (h && h.w && h.w !== lastW){ E = await liveGet(f); if (E) lastW = h.w; } else if (!h) E = await liveGet(f);   /* an older link without the quick check */
      if (Date.now() - ghAt > 5 * 60000){ ghAt = Date.now(); const G = await ghGet(f); if (G && (!E || (G.at || 0) > (E.at || 0))) E = G; }
      if (!E || !E.at || E.at <= lastAt) return;
      let N; try { N = await unlock(lc, lp, E); } catch(x){ if (x && x.message === "pw"){ store.del("lt-pw"); location.replace(location.pathname + "?pwchanged=1"); } return; }   /* the office changed the password: sign in again */ lastAt = E.at; Object.keys(docs).filter(k => k.startsWith("team/U/pkg/")).forEach(k => delete docs[k]); Object.assign(docs, N.docs);
      const si = soInOf(); if (si.length){ docs["team/U"] = { ...(docs["team/U"] || {}), soIn: si }; store.set(TK, JSON.stringify(docs["team/U"])); notify("team/U"); }
      notify("team/U/pkg/meta"); } catch(e){} };
  const freshWatch = () => { act("Signed in");
    window.addEventListener("click", e => { const a = e.target.closest && e.target.closest("a[href]"); if (!a) return; const h = a.getAttribute("href") || "", t = (a.textContent || "").trim().slice(0, 60);
      if (/^mailto:/i.test(h)){ const sub = decodeURIComponent((h.match(/[?&]subject=([^&]*)/i) || [])[1] || ""); act(`Opened an email to ${decodeURIComponent(h.slice(7).split("?")[0])}${sub ? ` ─ "${sub.slice(0, 80)}"` : ""}`); }
      else if (/wa\.me|whatsapp:|api\.whatsapp/i.test(h)) act(`Opened WhatsApp ${(h.match(/\d{7,}/) || [""])[0]}${t ? " ─ " + t : ""}`);
      else if (/^sms:/i.test(h)) act(`Opened a text to ${h.slice(4).split("?")[0]}`); }, true);
    setInterval(fresh, 30000); document.addEventListener("visibilitychange", () => { if (!document.hidden) fresh(); }); };
  if (P.reader && P.rtok) window.__ltReader = async (prompt, imgs) => { const b64 = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = no; r.readAsDataURL(b); });
    const images = []; for (const b of imgs) images.push(await b64(b));
    const r = await fetch(P.reader, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ u: P.meta.code, t: P.rtok, prompt, images }) });
    if (r.status === 401) throw { code: "signin" }; if (r.status === 429) throw { code: "rate_limited" }; if (!r.ok) throw { code: "failed" }; return r.json(); }; window.claude = { use: async n => n === "db" ? db : n === "user" ? user : n === "downloads" ? downloads : null };
  // signed out after 2 hours with no taps, clicks, typing or scrolling (5 minutes' warning first) ─ the next person must sign in again
  function idleWatch(){ const IDLE = 2 * 3600e3, WARN = 5 * 60e3; let last = Date.now(), bar = null;
    const out = () => { try { store.del("lt-pw"); store.del("lt-code"); } catch(e){} location.replace(location.pathname + "?signedout=1"); };
    const poke = () => { last = Date.now(); if (bar){ bar.remove(); bar = null; } };
    ["pointerdown", "keydown", "touchstart", "wheel", "scroll"].forEach(ev => window.addEventListener(ev, poke, { capture: true, passive: true }));
    const tick = () => { const idle = Date.now() - last; if (idle >= IDLE) return out();
      if (idle >= IDLE - WARN && !bar){ bar = document.createElement("div"); bar.style.cssText = "position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:10000;background:#b45309;color:#fff;border-radius:12px;padding:10px 16px;font:600 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer";
        bar.textContent = "Signing out in 5 minutes because of no activity ─ tap here to stay signed in"; bar.onclick = poke; document.body.appendChild(bar); } };

      const subj = O.length === 1 ? `Sales order ─ ${custName(O[0].cid)[0]} ─ ${P.meta.rep}` : `${O.length} sales orders ─ ${P.meta.rep}`;
      location.href = `mailto:${ORDER_EMAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(txt)}`;
